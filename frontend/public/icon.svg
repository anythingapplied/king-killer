<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App icon for King Killer: a face card with a crown. Original artwork; the
       PNGs next to it (icon-192/512, apple-touch-icon) are rendered from this. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- the card, tilted slightly -->
  <g transform="rotate(-8 256 256)">
    <rect x="136" y="92" width="240" height="328" rx="26" fill="#f8fafc" stroke="#7c3aed" stroke-width="10"/>
    <!-- crown -->
    <path d="M178 318 L194 206 L232 250 L256 184 L280 250 L318 206 L334 318 Z" fill="url(#crown)" stroke="#1e1b4b" stroke-width="8" stroke-linejoin="round"/>
    <rect x="176" y="318" width="160" height="30" rx="8" fill="url(#crown)" stroke="#1e1b4b" stroke-width="8"/>
    <circle cx="194" cy="200" r="13" fill="#fbbf24" stroke="#1e1b4b" stroke-width="6"/>
    <circle cx="256" cy="176" r="15" fill="#fbbf24" stroke="#1e1b4b" stroke-width="6"/>
    <circle cx="318" cy="200" r="13" fill="#fbbf24" stroke="#1e1b4b" stroke-width="6"/>
    <circle cx="256" cy="333" r="8" fill="#f8fafc"/>
  </g>
</svg>
