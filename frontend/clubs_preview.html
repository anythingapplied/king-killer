<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; }
        .example { display: flex; flex-direction: column; align-items: center; }
        .card { width: 200px; height: 280px; background: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; position: relative; }
        .label { margin-top: 20px; font-weight: bold; color: #94a3b8; }
        svg { width: 140px; height: 140px; }
    </style>
</head>
<body>
    <h1>Clubs Variation (Crossing Swords)</h1>
    <div class="grid">
        <!-- Variation 1: Classic Shortswords -->
        <div class="example">
            <div class="card">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- Sword 1 -->
                    <g transform="rotate(45, 50, 50)">
                        <rect x="48" y="10" width="4" height="60" rx="2" fill="black"/>
                        <rect x="40" y="70" width="20" height="4" rx="1" fill="black"/>
                        <rect x="47" y="74" width="6" height="12" rx="1" fill="black"/>
                    </g>
                    <!-- Sword 2 -->
                    <g transform="rotate(-45, 50, 50)">
                        <rect x="48" y="10" width="4" height="60" rx="2" fill="black"/>
                        <rect x="40" y="70" width="20" height="4" rx="1" fill="black"/>
                        <rect x="47" y="74" width="6" height="12" rx="1" fill="black"/>
                    </g>
                </svg>
            </div>
            <div class="label">1. Classic Shortswords</div>
        </div>

        <!-- Variation 2: Elegant Rapiers -->
        <div class="example">
            <div class="card">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- Rapier 1 -->
                    <g transform="rotate(45, 50, 50)">
                        <path d="M50,5 L52,70 L48,70 Z" fill="black"/>
                        <path d="M40,72 Q50,65 60,72" fill="none" stroke="black" stroke-width="3"/>
                        <rect x="48" y="75" width="4" height="15" rx="1" fill="black"/>
                    </g>
                    <!-- Rapier 2 -->
                    <g transform="rotate(-45, 50, 50)">
                        <path d="M50,5 L52,70 L48,70 Z" fill="black"/>
                        <path d="M40,72 Q50,65 60,72" fill="none" stroke="black" stroke-width="3"/>
                        <rect x="48" y="75" width="4" height="15" rx="1" fill="black"/>
                    </g>
                </svg>
            </div>
            <div class="label">2. Elegant Rapiers</div>
        </div>

        <!-- Variation 3: Heavy Broadswords -->
        <div class="example">
            <div class="card">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- Broadsword 1 -->
                    <g transform="rotate(45, 50, 50)">
                        <path d="M45,10 L55,10 L56,70 L44,70 Z" fill="black"/>
                        <path d="M50,10 L50,65" stroke="white" stroke-width="0.5"/>
                        <rect x="35" y="70" width="30" height="6" rx="1" fill="black"/>
                        <rect x="46" y="76" width="8" height="14" rx="1" fill="black"/>
                        <circle cx="50" cy="92" r="4" fill="black"/>
                    </g>
                    <!-- Broadsword 2 -->
                    <g transform="rotate(-45, 50, 50)">
                        <path d="M45,10 L55,10 L56,70 L44,70 Z" fill="black"/>
                        <path d="M50,10 L50,65" stroke="white" stroke-width="0.5"/>
                        <rect x="35" y="70" width="30" height="6" rx="1" fill="black"/>
                        <rect x="46" y="76" width="8" height="14" rx="1" fill="black"/>
                        <circle cx="50" cy="92" r="4" fill="black"/>
                    </g>
                </svg>
            </div>
            <div class="label">3. Heavy Broadswords</div>
        </div>
    </div>
</body>
</html>
