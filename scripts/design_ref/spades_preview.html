<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; }
        .example { display: flex; flex-direction: column; align-items: center; }
        .card { width: 200px; height: 280px; background: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; position: relative; }
        .label { margin-top: 20px; font-weight: bold; color: #94a3b8; }
        svg { width: 140px; height: 140px; }
    </style>
</head>
<body>
    <h1>Spades Variation (Shields)</h1>
    <div class="grid">
        <!-- Variation 1: The Heater Shield (Classic) -->
        <div class="example">
            <div class="card">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20,10 L80,10 L80,50 C80,75 50,95 50,95 C50,95 20,75 20,50 Z" fill="black"/>
                    <path d="M30,20 L70,20 L70,48 C70,65 50,82 50,82 C50,82 30,65 30,48 Z" fill="white" opacity="0.2"/>
                    <circle cx="50" cy="35" r="5" fill="white" opacity="0.3"/>
                </svg>
            </div>
            <div class="label">1. Heater Shield</div>
        </div>

        <!-- Variation 2: The Kite Shield (Pointy) -->
        <div class="example">
            <div class="card">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50,5 Q85,5 85,35 L50,95 L15,35 Q15,5 50,5 Z" fill="black"/>
                    <path d="M50,15 L50,85" stroke="white" stroke-width="2" opacity="0.1"/>
                    <path d="M30,30 L70,30" stroke="white" stroke-width="2" opacity="0.1"/>
                </svg>
            </div>
            <div class="label">2. Kite Shield</div>
        </div>

        <!-- Variation 3: The Greatshield (Heavy) -->
        <div class="example">
            <div class="card">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <rect x="20" y="10" width="60" height="80" rx="10" fill="black"/>
                    <rect x="25" y="15" width="50" height="70" rx="8" stroke="white" stroke-width="2" fill="none" opacity="0.2"/>
                    <circle cx="50" cy="50" r="12" fill="black" stroke="white" stroke-width="3"/>
                    <path d="M50,42 L50,58 M42,50 L58,50" stroke="white" stroke-width="2"/>
                </svg>
            </div>
            <div class="label">3. Tower Greatshield</div>
        </div>
    </div>
</body>
</html>
