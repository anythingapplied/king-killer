<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px; }
        .section { width: 100%; max-width: 1000px; margin-bottom: 60px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .example { display: flex; flex-direction: column; align-items: center; }
        .card { width: 180px; height: 250px; background: white; border-radius: 12px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; }
        .label { margin-top: 15px; font-weight: bold; color: #94a3b8; font-size: 14px; text-align: center; }
        
        /* Layout Styles */
        .rank-tl { position: absolute; top: 15px; left: 15px; font-size: 40px; font-weight: 900; color: #1e293b; }
        .rank-top-center { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 48px; font-weight: 900; color: #1e293b; }
        .suit-center { position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%); width: 100px; height: 100px; }
        .suit-bottom-center { position: absolute; top: 65%; left: 50%; transform: translate(-50%, -50%); width: 100px; height: 100px; }
        
        .plate-body { fill: #1e293b; stroke: black; stroke-width: 2; }
        .plate-trim { fill: #64748b; opacity: 0.5; stroke: black; stroke-width: 0.5; }
        
        /* Corruption Patterns */
        .tentacle-path { fill: #7c3aed; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="section">
        <h2>1 Number + 1 Symbol Variations (7 of Spades)</h2>
        <div class="grid">
            <!-- 1. Classic Offset -->
            <div class="example">
                <div class="card">
                    <div class="rank-tl">7</div>
                    <div class="suit-center">
                        <svg viewBox="0 0 100 100">
                            <path class="plate-body" d="M20,10 L80,10 L80,50 C80,75 50,95 50,95 C50,95 20,75 20,50 Z"/>
                            <path class="plate-trim" d="M30,20 L70,20 L70,48 C70,65 50,82 50,82 C50,82 30,65 30,48 Z"/>
                        </svg>
                    </div>
                </div>
                <div class="label">1. Classic Offset</div>
            </div>

            <!-- 2. Vertical Stack -->
            <div class="example">
                <div class="card">
                    <div class="rank-top-center">7</div>
                    <div class="suit-bottom-center">
                        <svg viewBox="0 0 100 100">
                            <path class="plate-body" d="M20,10 L80,10 L80,50 C80,75 50,95 50,95 C50,95 20,75 20,50 Z"/>
                            <path class="plate-trim" d="M30,20 L70,20 L70,48 C70,65 50,82 50,82 C50,82 30,65 30,48 Z"/>
                        </svg>
                    </div>
                </div>
                <div class="label">2. Vertical Stack</div>
            </div>

            <!-- 3. The Center Group -->
            <div class="example">
                <div class="card">
                    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%;">
                        <div style="font-size: 60px; font-weight: 900; color: #1e293b; line-height: 0.8;">7</div>
                        <div style="width: 100px; height: 100px;">
                            <svg viewBox="0 0 100 100">
                                <path class="plate-body" d="M20,10 L80,10 L80,50 C80,75 50,95 50,95 C50,95 20,75 20,50 Z"/>
                                <path class="plate-trim" d="M30,20 L70,20 L70,48 C70,65 50,82 50,82 C50,82 30,65 30,48 Z"/>
                            </svg>
                        </div>
                    </div>
                </div>
                <div class="label">3. Center Group</div>
            </div>

            <!-- 4. Corner Duo -->
            <div class="example">
                <div class="card">
                    <div style="position:absolute; top:20px; left:20px; font-size:40px; font-weight:900; color:#1e293b;">7</div>
                    <div style="position:absolute; top:20px; right:20px; width:40px; height:40px;">
                        <svg viewBox="0 0 100 100">
                            <path class="plate-body" d="M20,10 L80,10 L80,50 C80,75 50,95 50,95 C50,95 20,75 20,50 Z"/>
                        </svg>
                    </div>
                </div>
                <div class="label">4. Corner Duo</div>
            </div>
        </div>
    </div>

    <div class="section">
        <h2>Abstract "Writhing" Royalty (King of Spades)</h2>
        <div class="grid">
            <!-- KS V1: Jagged Edge -->
            <div class="example">
                <div class="card">
                    <!-- Abstract Writhing Edge -->
                    <svg style="position:absolute; inset:0; width:100%; height:100%;" viewBox="0 0 200 280">
                        <path class="tentacle-path" d="M0,0 L200,0 L200,280 L0,280 Z M15,15 L15,265 L185,265 L185,15 Z" fill-rule="evenodd"/>
                        <path class="tentacle-path" d="M15,15 Q25,30 15,45 Q5,60 15,75 Q25,90 15,105 L0,105 L0,0 Z"/>
                        <path class="tentacle-path" d="M185,50 Q170,65 185,80 Q200,95 185,110 L200,110 L200,50 Z"/>
                        <path class="tentacle-path" d="M100,15 Q115,0 130,15 L130,0 L100,0 Z"/>
                    </svg>
                    <div class="rank-tl" style="color:#7c3aed; z-index:10;">K</div>
                    <div class="suit-center">
                        <svg viewBox="0 0 100 100">
                            <path class="plate-body" style="fill:#4c1d95" d="M20,10 L80,10 L80,50 C80,75 50,95 50,95 C50,95 20,75 20,50 Z"/>
                        </svg>
                    </div>
                </div>
                <div class="label">V1: Jagged "Creep"</div>
            </div>

            <!-- KS V2: Wavy Pulse -->
            <div class="example">
                <div class="card">
                    <svg style="position:absolute; inset:0; width:100%; height:100%;" viewBox="0 0 200 280">
                        <path fill="#581c87" d="M0,0 Q20,20 0,40 Q20,60 0,80 Q20,100 0,120 L0,0 Z"/>
                        <path fill="#581c87" d="M200,0 Q180,20 200,40 Q180,60 200,80 Q180,100 200,120 L200,0 Z"/>
                        <path fill="#581c87" d="M0,280 Q20,260 40,280 Q60,260 80,280 L0,280 Z"/>
                        <rect x="0" y="0" width="200" height="280" fill="none" stroke="#7c3aed" stroke-width="6"/>
                    </svg>
                    <div class="rank-tl" style="color:#a855f7; z-index:10;">K</div>
                    <div class="suit-center">
                        <svg viewBox="0 0 100 100">
                            <path class="plate-body" d="M20,10 L80,10 L80,50 C80,75 50,95 50,95 C50,95 20,75 20,50 Z"/>
                        </svg>
                    </div>
                </div>
                <div class="label">V2: Wavy "Pulse"</div>
            </div>

            <!-- KS V3: Abstract Tendrils -->
            <div class="example">
                <div class="card">
                    <svg style="position:absolute; inset:0; width:100%; height:100%;" viewBox="0 0 200 280">
                        <!-- Top Abstract Edge -->
                        <path fill="#4c1d95" d="M0,0 L200,0 L200,30 Q170,10 140,35 Q110,5 80,40 Q40,10 0,30 Z"/>
                        <!-- Bottom Abstract Edge -->
                        <path fill="#4c1d95" d="M0,280 L200,280 L200,250 Q160,270 120,240 Q80,280 40,245 Q20,270 0,255 Z"/>
                    </svg>
                    <div class="rank-tl" style="color:white; z-index:10;">K</div>
                    <div class="suit-center">
                        <svg viewBox="0 0 100 100">
                            <path class="plate-body" d="M20,10 L80,10 L80,50 C80,75 50,95 50,95 C50,95 20,75 20,50 Z"/>
                        </svg>
                    </div>
                </div>
                <div class="label">V3: Weighted Abstract</div>
            </div>
        </div>
    </div>
</body>
</html>
