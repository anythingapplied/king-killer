<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .example { display: flex; flex-direction: column; align-items: center; }
        .card { width: 180px; height: 250px; background: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .label { margin-top: 15px; font-weight: bold; color: #94a3b8; font-size: 14px; text-align: center; }
        svg { width: 120px; height: 120px; }
    </style>
</head>
<body>
    <h1>RPG Suit Redesign (Black/Grey Two-Tone)</h1>
    
    <div class="grid">
        <!-- THE SPADE -->
        <div class="example">
            <div class="card">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- Main Body -->
                    <path d="M20,10 L80,10 L80,50 C80,75 50,95 50,95 C50,95 20,75 20,50 Z" fill="#1e293b"/>
                    <!-- Trim/Shadow -->
                    <path d="M30,20 L70,20 L70,48 C70,65 50,82 50,82 C50,82 30,65 30,48 Z" fill="#64748b" opacity="0.4"/>
                    <!-- Inset lines -->
                    <path d="M20,10 L80,10 L80,50 C80,75 50,95 50,95 C50,95 20,75 20,50 Z" fill="none" stroke="black" stroke-width="2"/>
                </svg>
            </div>
            <div class="label">Spades:<br/>Heater Shield</div>
        </div>

        <!-- HEART 1: The Potion -->
        <div class="example">
            <div class="card">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- Bottle -->
                    <path d="M50,95 C20,95 20,60 35,45 L35,15 L65,15 L65,45 C80,60 80,95 50,95 Z" fill="#1e293b" stroke="black" stroke-width="2"/>
                    <!-- Liquid -->
                    <path d="M38,50 Q50,40 62,50 C75,65 70,88 50,88 C30,88 25,65 38,50 Z" fill="#ef4444" opacity="0.8"/>
                    <!-- Reflection -->
                    <path d="M45,25 L55,25 M40,20 L60,20" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="label">Hearts V1:<br/>Heal Potion</div>
        </div>

        <!-- HEART 2: The Crest -->
        <div class="example">
            <div class="card">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- Heart Shape Base -->
                    <path d="M50,90 C50,90 10,65 10,35 A20,20 0 0,1 50,35 A20,20 0 0,1 90,35 C90,65 50,90 50,90 Z" fill="#1e293b" stroke="black" stroke-width="2"/>
                    <!-- Steel Plating -->
                    <path d="M50,80 C50,80 20,60 20,40 A15,15 0 0,1 50,40 A15,15 0 0,1 80,40 C80,60 50,80 50,80 Z" fill="#64748b" opacity="0.4"/>
                    <!-- Vertical Split -->
                    <path d="M50,35 L50,90" stroke="black" stroke-width="1" opacity="0.5"/>
                </svg>
            </div>
            <div class="label">Hearts V2:<br/>Steel Heart</div>
        </div>

        <!-- HEART 3: The Winged Heart -->
        <div class="example">
            <div class="card">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- Wings -->
                    <path d="M10,40 Q25,10 50,40 Q75,10 90,40 L50,60 Z" fill="#64748b" opacity="0.3" stroke="black"/>
                    <!-- Core -->
                    <path d="M50,85 C50,85 25,65 25,45 A12.5,12.5 0 0,1 50,45 A12.5,12.5 0 0,1 75,45 C75,65 50,85 50,85 Z" fill="#1e293b" stroke="black" stroke-width="2"/>
                </svg>
            </div>
            <div class="label">Hearts V3:<br/>Paladin Heart</div>
        </div>
    </div>
</body>
</html>
