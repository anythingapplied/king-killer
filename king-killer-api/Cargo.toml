[package]
name = "king-killer-api"
version = "0.1.0"
edition = "2024"

# Versions are exact (Standards 4.13): an upgrade is a deliberate, tested change,
# never something a fresh resolve picks up on its own. Dependabot proposes them.
[dependencies]
axum = { version = "=0.8.9", features = ["ws", "macros"] }
tokio = { version = "=1.54.1", features = ["full"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sqlx = { version = "=0.9.1", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tower-http = { version = "=0.7.1", features = ["fs"] }
king-killer-core = { path = "../king-killer-core" }
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
futures = "=0.3.32"
rand = "=0.10.3"
p256 = { version = "=0.14.0", features = ["ecdh", "ecdsa"] }
hkdf = "=0.13.0"
sha2 = "=0.11.0"
aes-gcm = "=0.11.1"
base64 = "=0.23.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
axum-extra = { version = "=0.12.6", features = ["cookie"] }
time = "=0.3.55"

[dev-dependencies]
tokio-tungstenite = "=0.30.0"
tower = { version = "=0.5.3", features = ["util"] }
