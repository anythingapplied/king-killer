[package]
name = "king-killer-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "macros", "migrate"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
uuid = { version = "1.13", features = ["v4", "serde"] }
king-killer-core = { path = "../king-killer-core" }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3.32"
rand = "0.10.1"
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa"] }
hkdf = "0.13.0"
sha2 = "0.11.0"
aes-gcm = "0.11.1"
base64 = "0.23.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }

[dev-dependencies]
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
